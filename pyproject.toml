[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ramify"
version = "2.0.0"
description = "Segment and measure branching shapes: centerlines, hierarchical space partitioning, and width"
keywords = [
    "centerline",
    "skeleton",
    "medial-axis",
    "segmentation",
    "raster",
    "geomorphology",
    "river",
    "valley",
    "morphometry",
    "width",
]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-image",
    "affine",
    "rasterio",
    "shapely>=2.0",
    "geopandas",
    "xarray",
    "rioxarray",
]

[project.optional-dependencies]
dev = [
    "matplotlib",
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["ramify"]

